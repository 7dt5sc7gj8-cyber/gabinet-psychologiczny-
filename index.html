<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mgr Anna Adamiak-Tazbir | Psycholog, Biolog, Psychoterapeuta</title>
    <style>
        :root {
            --bg-color: #faf9f5;
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --card-bg: #ffffff;
            --border-color: #e5e5ea;
            --accent-sage: #e8efe9;
            --accent-sage-dark: #2c3e35;
            --accent-soft-warm: #f4efe8;
            --header-bg: rgba(250, 249, 245, 0.9);
            --shadow-sm: 0 4px 16px rgba(0,0,0,0.03);
            --shadow-md: 0 12px 32px rgba(0,0,0,0.06);
        }

        [data-theme="dark"] {
            --bg-color: #121214;
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --card-bg: #1c1c1e;
            --border-color: #2c2c2e;
            --accent-sage: #1e2e24;
            --accent-sage-dark: #9bbca6;
            --accent-soft-warm: #262320;
            --header-bg: rgba(18, 18, 20, 0.9);
            --shadow-sm: 0 4px 16px rgba(0,0,0,0.3);
            --shadow-md: 0 12px 32px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; -webkit-font-smoothing: antialiased; transition: background-color 0.3s, color 0.3s; }
        
        header { background: var(--header-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); padding: 16px 8%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 600; font-size: 1.05rem; letter-spacing: -0.01em; color: var(--text-main); }
        
        .nav-container { display: flex; gap: 20px; align-items: center; }
        .nav-links { display: flex; gap: 20px; font-size: 0.9rem; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; font-weight: 400; }
        .nav-links a:hover { color: var(--text-main); }
        
        .theme-toggle { background: var(--accent-sage); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .theme-toggle:hover { opacity: 0.85; transform: scale(1.02); }

        .cta-btn { background: var(--text-main); color: var(--bg-color); padding: 9px 18px; border-radius: 22px; font-weight: 500; text-decoration: none; font-size: 0.85rem; transition: opacity 0.2s; }
        .cta-btn:hover { opacity: 0.85; }

        .hero { max-width: 1060px; margin: 50px auto 30px; padding: 0 24px; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; align-items: center; }
        .hero-text h1 { font-size: 3.2rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 24px; }
        
        .quote-box { background: var(--accent-sage); padding: 20px 24px; border-radius: 18px; color: var(--text-main); margin-bottom: 24px; border-left: 4px solid var(--accent-sage-dark); }
        .quote-box p { font-style: italic; font-size: 1.05rem; margin-bottom: 6px; }
        .quote-box span { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent-sage-dark); }

        .hero-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 28px; padding: 16px; box-shadow: var(--shadow-md); text-align: center; }
        .hero-card img { width: 100%; height: 340px; border-radius: 20px; object-fit: cover; display: block; }
        .hero-card-caption { padding: 14px 8px 6px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

        .section { max-width: 1060px; margin: 70px auto; padding: 0 24px; }
        .section-title { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 32px; }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .card h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 14px; color: var(--text-main); }
        .card ul { list-style-type: none; padding: 0; }
        .card ul li { position: relative; padding-left: 20px; margin-bottom: 10px; color: var(--text-muted); font-size: 0.95rem; }
        .card ul li::before { content: "•"; position: absolute; left: 0; color: var(--accent-sage-dark); font-weight: bold; }

        .timeline-item { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 22px 28px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; box-shadow: var(--shadow-sm); }
        .timeline-content h4 { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
        .timeline-content p { font-size: 0.92rem; color: var(--text-muted); }
        .timeline-year { font-size: 0.85rem; font-weight: 600; color: var(--accent-sage-dark); background: var(--accent-sage); padding: 6px 14px; border-radius: 14px; white-space: nowrap; }

        .list-box { background: var(--accent-soft-warm); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; margin-bottom: 24px; }
        .list-box h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; color: var(--text-main); }
        .list-box ul { list-style: none; }
        .list-box ul li { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 12px; position: relative; padding-left: 22px; line-height: 1.5; }
        .list-box ul li::before { content: "✓"; position: absolute; left: 0; color: var(--accent-sage-dark); font-weight: bold; }

        footer { text-align: center; padding: 60px 24px; color: var(--text-muted); font-size: 0.95rem; border-top: 1px solid var(--border-color); margin-top: 80px; background: var(--card-bg); }
        footer strong { color: var(--text-main); }

        @media(max-width: 860px) {
            .hero { grid-template-columns: 1fr; text-align: center; }
            .hero-text h1 { font-size: 2.4rem; }
            .nav-links { display: none; }
            .timeline-item { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
